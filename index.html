<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7c7d5"><title>Siberia cumple 1 año</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff5f7;color:#402c31;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.page{width:100%;max-width:1024px;margin:auto;background:#fff}.invite{position:relative;line-height:0}.invite img{display:block;width:100%;height:auto}.date-fix{position:absolute;left:13%;top:56%;width:74%;min-height:15%;background:#fffaf6;border:2px solid #f4d9df;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;text-align:center;padding:12px;box-shadow:0 6px 22px #64364120}.date-fix b{font-family:Georgia,serif;font-size:clamp(20px,5.2vw,48px);color:#e7276d}.date-fix span{font-weight:800;font-size:clamp(16px,4.2vw,37px);margin-top:5px}.date-fix small{font-size:clamp(12px,2.8vw,22px);margin-top:6px}.actions{padding:18px 16px 10px;background:#fffaf6;display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{display:flex;align-items:center;justify-content:center;min-height:58px;border-radius:18px;text-decoration:none;font-weight:850;font-size:17px;text-align:center;padding:12px}.pink{background:#e7276d;color:white}.gold{background:#f1c76a;color:#442f1e}.count{background:#fffaf6;text-align:center;padding:10px 15px 18px;line-height:1.3}.count b{display:block;color:#d92869;font-size:14px;letter-spacing:.1em}.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:560px;margin:9px auto 0}.timer span{background:#4c3038;color:#fff;padding:10px 4px;border-radius:13px;font-weight:800;font-size:18px}.timer small{display:block;font-size:9px;opacity:.85;margin-top:3px}.note{padding:12px 20px 25px;background:#fffaf6;text-align:center;line-height:1.45;font-size:14px;color:#72505a}@media(max-width:520px){.actions{grid-template-columns:1fr}.date-fix{left:8%;width:84%;top:55.5%;min-height:16%;border-radius:18px}.btn{min-height:56px}}</style></head><body><main class="page"><section class="invite"><img id="inviteImg" alt="Invitación del primer cumpleaños de Siberia"><div id="loading" style="position:absolute;inset:0;display:grid;place-items:center;background:#fff5f7;color:#d92d69;line-height:1.3;font-weight:800">Cargando invitación…</div><div class="date-fix"><b>5 DE SEPTIEMBRE DE 2026</b><span>4:00 P. M.</span><small>En casa de Siberia 🐾</small></div></section><section class="count"><b>FALTAN PARA LA FIESTA</b><div id="timer" class="timer"></div></section><section class="actions"><a class="btn pink" href="confirmar.html">🐾 Confirmar asistencia</a><a class="btn gold" href="regalos.html">🎁 Mesa de regalos</a></section><div class="note">Todo está incluido para los peludos. La comida humana se compra en el momento. 💗</div></main><script>const raw='https://raw.githubusercontent.com/ddotroo-cloud/siberia-cumple/main/assets/';Promise.all(['invite-01.txt','invite-02.txt','invite-03.txt','invite-04.txt'].map(f=>fetch(raw+f+'?v=4').then(r=>{if(!r.ok)throw new Error(f);return r.text()}))).then(a=>{document.getElementById('inviteImg').src='data:image/webp;base64,'+a.join('').replace(/\s/g,'');document.getElementById('loading').remove()}).catch(()=>{document.getElementById('loading').textContent='No se pudo cargar la invitación. Actualiza la página.'});const end=new Date('2026-09-05T16:00:00-06:00');function tick(){let s=Math.max(0,Math.floor((end-Date.now())/1000));const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60),x=s%60;document.getElementById('timer').innerHTML=[[d,'DÍAS'],[h,'HORAS'],[m,'MIN'],[x,'SEG']].map(v=>`<span>${String(v[0]).padStart(2,'0')}<small>${v[1]}</small></span>`).join('')}tick();setInterval(tick,1000);</script></body></html>
