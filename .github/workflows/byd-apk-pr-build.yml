name: Build BYD APK from PR

on:
  pull_request:
    branches: [ byd-ci-base ]
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        working-directory: byd-apk/project
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK
        run: test -f byd-apk/project/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BYDPasswordAuto-debug-apk
          path: byd-apk/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
